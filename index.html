
<!DOCTYPE html>
<html lang="tr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReklamKes</title>
  <style>

      margin: 0;
      font-family: Arial, sans-serif;

<body>

      <button onclick="alert('Reklam filtreleme özelliğini sonraki adımda ekleyeceğiz!')">

    <div class="card">
